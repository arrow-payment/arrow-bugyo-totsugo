<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>給与突合</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="reconcile.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>給与突合</h1>

    <div class="drops">
      <label class="drop" id="drop-bugyo">
        <input type="file" accept=".xlsx,.xls">
        <span class="drop-main">奉行の給与データ</span>
        <span class="drop-sub">Excelを選択またはドロップ</span>
      </label>
      <label class="drop" id="drop-arrow">
        <input type="file" accept=".csv">
        <span class="drop-main">ARROWの給与データ</span>
        <span class="drop-sub">csvを選択またはドロップ</span>
      </label>
    </div>

    <section class="error" id="error" hidden>
      <p class="message"></p>
      <ul></ul>
    </section>

    <section class="result" id="result" hidden>
      <div class="result-head">
        <dl class="summary">
          <div><dt>突合</dt><dd id="matched"></dd></div>
          <div><dt>全項目一致</dt><dd id="all-ok"></dd></div>
          <div><dt>不一致あり</dt><dd id="ng"></dd></div>
        </dl>
        <label class="tolerance">差が<input type="number" id="tolerance" min="1" step="1" value="10">円未満は一致</label>
      </div>
      <p class="breakdown" id="breakdown"></p>

      <div class="notice" id="notice" hidden>
        <p class="message"></p>
        <ul></ul>
      </div>

      <div class="filters">
        <select id="item-filter"></select>
        <input type="search" id="emp-filter" class="filter" placeholder="社員コードで絞り込み">
        <label class="only-ng"><input type="checkbox" id="only-ng"><span>不一致のみ</span></label>
      </div>
      <div class="preview">
        <table>
          <thead id="head"></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" hidden>該当する社員はいません</p>
      </div>
      <button type="button" id="download">結果をダウンロード</button>
    </section>
  </main>
</body>
</html>
